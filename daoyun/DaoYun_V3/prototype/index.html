function profile(){return `<section class="card flush"><div class="profilecover"></div><div style="padding:22px"><div class="between">${avatar('林',true)}${btn('关注',"sim('关注该用户')",'primary')}</div><h1 class="mt12">林间晚风 ${pill('Lv.5','blue')}</h1><p class="muted">@linwan · 把有用的经验留在这里</p><div class="labelset mt12">${pill('热心分享')}${pill('长期同行')}</div><p class="muted tiny mt12">公开资料仅展示公开身份，不包含积分流水、设备或私有权益。</p></div></section><div class="mt">${tabs(['发布的帖子','公开资料'])}</div>`+posts.slice(0,2).map(post).join('')}
let memberTab='成长概览';
function member(){let body='';if(memberTab==='积分'){body=`<div class="card"><div class="between"><div><small>可消费积分 · 演示</small><h1>1,280</h1></div>${pill('不影响成长经验','blue')}</div><div class="lineitem between"><div><strong>社区贡献</strong><p class="muted tiny">10-02 09:10</p></div><strong class="green">+10</strong></div><div class="lineitem between"><div><strong>积分兑换</strong><p class="muted tiny">10-01 19:32</p></div><strong>−200</strong></div><p class="muted mt12">这里只显示本人流水，不能进入管理员积分调整界面。</p></div>`}else if(memberTab==='权益'){body=`<div class="card"><h2>当前有效权益</h2><div class="lineitem between"><div><strong>大附件额度</strong><p class="muted tiny">有效期至 2026-10-31 · 演示</p></div>${pill('50 MiB','blue')}</div>${note('具体动作仍受账号、版块与已用额度限制。公开主页不展示这些私有记录。')}</div>`}else{body=`<div class="card"><h2>我的勋章</h2><div class="grid3 mt" style="grid-template-columns:repeat(3,1fr)">${[['初来乍到','silver'],['热心分享',''],['认真讨论','silver']].map(([t,c])=>`<div style="text-align:center"><div class="medal ${c}">${icon('star')}</div><small>${t}</small></div>`).join('')}</div></div><div class="card mt"><h2>常用入口</h2>${[['积分与明细','member-points'],['公开主页','profile'],['私信会话','messages'],['账号与安全','account']].map(([t,g])=>`<div class="lineitem between"><span>${t}</span>${g==='member-points'?btn('查看',"memberTab='积分';render()",'text'):`<a href="#${g}">${icon('chevron')}</a>`}</div>`).join('')}</div>`}return head('我的成长','成长、积分和权益各归其位，概览只加载必要摘要。')+`<section class="card"><div class="row">${avatar('林',true)}<div><h2>林间晚风</h2><p class="muted">继续分享，也认真回应</p></div><span class="spacer"></span>${pill('Lv.5','blue')}</div><div class="between mt"><strong>1,250 EXP</strong><small>下一级 2,000 EXP · 示例</small></div><div class="progress"><span style="width:62.5%"></span></div></section><div class="tabs mt">${['成长概览','积分','权益','勋章'].map(t=>`<button class="${t===memberTab?'active':''}" onclick="memberTab='${t}';render()">${t}</button>`).join('')}</div>`+body+`<p class="caption">积分不会抵扣成长经验；会员身份不自动授予管理职务。</p>`}
let notifyFilter='all';const readDemo=new Set();
function notifications(){let items=[['程序旅行者','回复了你的主题','如何整理自己的知识库？','刚刚'],['山间小鹿','赞了你的内容','周末出门，给自己留一点空白','10分钟前'],['系统通知','你的举报已有处理结果','查看允许公开的处理说明','30分钟前']];let entries=items.map((r,i)=>({r,i})).filter(({i})=>notifyFilter==='all'||!readDemo.has(i));return head('通知',`全局未读 ${unread} · 原型模拟值`,btn('全部已读',"allReadDemo()",'small','check'))+`<div class="tabs"><button class="${notifyFilter==='all'?'active':''}" onclick="notifyFilter='all';render()">全部</button><button class="${notifyFilter==='unread'?'active':''}" onclick="notifyFilter='unread';render()">未读 <span id="unreadbadge">${unread}</span></button><a href="#messages">私信</a></div><div class="card">${entries.length?entries.map(({r:[n,v,t,tm],i})=>`<div class="lineitem"><span class="dot" style="background:${readDemo.has(i)?'#c9d1dc':'#20a17c'}"></span>${avatar(n)}<div class="spacer"><strong>${n}</strong> ${v}<p class="muted tiny">${t}</p><small>${tm}</small></div><div class="stack gap8">${btn('查看',"go('topic')",'text')}<button class="btn small" onclick="markReadDemo(${i})" ${readDemo.has(i)?'disabled':''}>${readDemo.has(i)?'已读':'标记已读'}</button></div></div>`).join(''):`<div class="empty">${unread?'当前3条示例已读；其余未读需真实服务端分页加载。':'没有未读通知'}</div>`}</div><div class="mt">${note('原型可演示 55 → 54 的全局计数，不用当前3条列表冒充总数。真实实现需服务端未读筛选、分页与水位。')}</div>`}
function markReadDemo(i){if(readDemo.has(i))return;readDemo.add(i);unread=Math.max(0,unread-1);render();toast('模拟全局未读已更新为 '+unread)}
function allReadDemo(){modal('全部标记已读',note('真实实现应按服务器确定的通知水位处理，晚于水位的新通知继续未读。此处只演示原型计数。'),'确认演示',"unread=0;[0,1,2].forEach(i=>readDemo.add(i));closeModal();render();toast('模拟计数更新为0')")}
function searchPage(){return head('搜索社区','主题、用户与版块分区加载，单个区域失败不拖垮其他结果。')+`<div class="card toolbar mb">${search('Rust、知识库、社区…')}${btn('搜索',"sim('搜索词保留到网址')",'primary')}</div>`+tabs(['综合','帖子','版块','用户','标签'])+`<div class="card mb"><div class="between"><h2>版块</h2><a href="#board">技术交流 →</a></div></div>`+post(posts[0])+`<div class="card"><div class="between"><h2>用户</h2>${pill('局部失败示例','amber')}</div><p class="muted mt12">用户搜索暂时不可用，帖子和版块结果仍正常显示。</p>${btn('只重试用户搜索',"sim('仅重试用户结果')",'light')}</div>`}
function messages(){return head('私信','对话与通知分开，发送失败保留输入。')+`<section class="card"><div class="row mb">${avatar('程')}<div><h2>程序旅行者</h2><small>一对一会话 · 演示</small></div><span class="spacer"></span>${btn('会话设置',"sim('会话设置：屏蔽、归档等沿用已有能力')",'small')}</div><div style="min-height:255px;display:flex;flex-direction:column"><div class="msgbubble">看了你发的知识库整理帖子，很有帮助。</div><div class="msgbubble me">谢谢，也欢迎分享你的方法。</div><div class="msgbubble">可以从实际问题开始整理，目录不必太复杂。</div></div><textarea style="width:100%" rows="3" aria-label="私信内容" placeholder="输入消息…"></textarea><div class="between mt12"><small>原型不发送消息</small>${btn('发送',"sim('消息发送示例，不访问真实接口')",'primary')}</div></section>`}
function account(){return head('账号与安全','安全能力独立于会员运营，不随简洁模式消失。')+`<div class="card">${[['个人资料','修改昵称与介绍','edit'],['修改密码','按已有近期认证流程','lock'],['通行密钥','已绑定的凭据保留','shield'],['两步验证','TOTP 与恢复码按配置启用','shield'],['外部身份','OIDC 绑定与恢复路径','link'],['设备会话','查看与撤销其他设备','users']].map(([t,d,ic])=>`<div class="lineitem"><span class="stat-icon">${icon(ic)}</span><div class="spacer"><strong>${t}</strong><p class="muted tiny">${d}</p></div>${btn('设置',`sim('${t}沿用既有安全流程')`,'text')}</div>`).join('')}</div><div class="mt">${note('此原型不接触任何密码、密钥、真实Cookie或登录数据。')}</div>`}
const RENDERS={dashboard,users,'user-detail':userDetail,groups,'group-edit':groupEdit,'group-compare':groupCompare,'boards-admin':boardsAdmin,'board-settings':boardSettings,permissions,team,'role-edit':roleEdit,inspect,growth,points,medals,entitlements,moderation:()=>governance('moderation'),comments:()=>governance('comments'),reports:()=>governance('reports'),reviews:()=>governance('reviews'),risk:()=>governance('risk'),audit:()=>governance('audit'),extensions,analytics,settings,ops,home,boards,board,topic,composer,profile,member,notifications,search:searchPage,messages,bookmarks:()=>head('我的收藏','收藏不绕过最新内容访问规则。')+posts.slice(0,2).map(post).join(''),account};
function render(){current=location.hash.slice(1)||'groups';if(!PAGES[current])current='groups';closeModal();document.title=PAGES[current][1]+' · 刀云设计原型';const content=RENDERS[current]();document.getElementById('app').innerHTML=PAGES[current][2]==='前台'?frontShell(content):adminShell(content);window.scrollTo(0,0)}
window.addEventListener('hashchange',render);window.DY_PAGES=PAGES;render();
</script></body></html>
