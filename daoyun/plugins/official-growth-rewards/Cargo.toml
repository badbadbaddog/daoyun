[package]
name = "daoyun-official-growth-rewards"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.18", default-features = false, features = ["serde", "v5"] }
wit-bindgen = { version = "=0.58.0", default-features = false, features = ["macros", "realloc", "std"] }

[workspace]
