[workspace]
members = ["apps/api", "crates/api-contract"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.94"

[workspace.dependencies]
api-contract = { path = "crates/api-contract" }
axum = "0.8.9"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["macros", "net", "rt-multi-thread"] }
tower = { version = "0.5.3", features = ["util"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
utoipa = { version = "5.5.0", features = ["uuid"] }
uuid = { version = "1.24.0", features = ["serde", "v7"] }

[workspace.lints.rust]
unsafe_code = "forbid"
